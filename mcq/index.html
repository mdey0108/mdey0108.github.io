<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Software Engineer Persona Test</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <header>
            <h1>Software Engineer Persona Test</h1>
            <p>Discover your true developer nature.</p>
        </header>

        <main id="quiz-container">
            <!-- Questions will be injected here -->
            <div id="start-screen">
                <p>Are you a 10x Engineer or a Chaos Monkey? Let's find out.</p>

                <div class="user-inputs">
                    <input type="text" id="user-name" placeholder="Enter your Name" required>
                    <input type="text" id="user-role" placeholder="Current Role (e.g. Senior Dev)" required>
                    <input type="text" id="user-company" placeholder="Company Name" required>
                </div>

                <button id="start-btn" class="btn">Run Diagnostics</button>
            </div>
        </main>

        <footer>
            <p>&copy; 2024 Developer Humor Corp</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>

</html>
